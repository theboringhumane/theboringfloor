# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: theboringfloor

builds:
  - id: theboringfloor
    main: ./cmd/theboringfloor
    binary: theboringfloor
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/theboringhumane/theboringfloor/internal/version.Version={{ .Version }}
        -X github.com/theboringhumane/theboringfloor/internal/version.Commit={{ .Commit }}
        -X github.com/theboringhumane/theboringfloor/internal/version.Date={{ .Date }}
  - id: thefloor_mcp
    main: ./cmd/thefloor_mcp
    binary: thefloor_mcp
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/theboringhumane/theboringfloor/internal/version.Version={{ .Version }}
        -X github.com/theboringhumane/theboringfloor/internal/version.Commit={{ .Commit }}
        -X github.com/theboringhumane/theboringfloor/internal/version.Date={{ .Date }}

archives:
  - id: theboringfloor
    ids:
      - theboringfloor
      - thefloor_mcp
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "theboringfloor_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Fixes
      regexp: "^fix"
      order: 1
    - title: Other
      order: 999
